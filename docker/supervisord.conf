[program:php-fpm]
command=/usr/sbin/php-fpm8.4 --nodaemonize
autostart=true
autorestart=true
priority=10

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=20

[program:reverb]
directory=/var/www/html
command=php artisan reverb:start --host=0.0.0.0 --port=6001
autostart=true
autorestart=true
priority=30
