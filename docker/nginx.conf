server {
    # Render binds its public HTTP/HTTPS routing dynamically to this environment variable port
    listen %PORT%;
    listen [::]:%PORT%;
    server_name localhost;
    
    root /var/www/public;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 64M;

    # 1. Primary Route: Laravel App & Inertia/React Views
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 2. WebSocket Route: Dedicated Laravel Reverb Tunneling
    location /app {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        
        # Upgrade standard HTTP connections into open WebSocket streams
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Pass native environmental headers along to Reverb tracking
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Ensure long-running real-time connections don't drop abruptly
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Process PHP-FPM requests cleanly over localhost loopback
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}