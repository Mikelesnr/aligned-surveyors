name: Deploy Laravel
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy and Restart Services
        uses: appleboy/ssh-action@master
        with:
          host: 139.84.249.68
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /var/www/laravel-app
            
            # 1. Take ownership
            echo "--- Changing ownership to mikelesnr ---"
            sudo chown -R mikelesnr:mikelesnr /var/www/laravel-app
            
            # 2. Pull code
            eval "$(ssh-agent -s)"
            ssh-add /home/mikelesnr/.ssh/id_ed25519
            echo "--- Pulling latest code ---"
            git pull origin main
            
            # 3. RUN ALL TASKS AS MIKELESNR (No sudo -u www-data needed)
            echo "--- Running backend tasks ---"
            composer install --no-dev --optimize-autoloader
            php artisan migrate --force
            
            echo "--- Building frontend assets ---"
            npm install
            npm run build
            
            echo "--- Caching config ---"
            php artisan config:cache
            
            # 4. Final ownership revert (ONLY at the very end)
            echo "--- Reverting ownership to www-data for Nginx ---"
            sudo chown -R www-data:www-data /var/www/laravel-app
            
            echo "--- Restarting services ---"
            sudo systemctl reload nginx
            sudo systemctl restart supervisor
            echo "Deployment finished successfully!"