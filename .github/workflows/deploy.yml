name: Deploy Laravel
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy and Restart Services
        uses: appleboy/ssh-action@master
        with:
          host: 139.84.249.68
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /var/www/laravel-app
            
            # 1. Take ownership to pull code
            echo "--- Changing ownership to mikelesnr ---"
            sudo chown -R mikelesnr:mikelesnr /var/www/laravel-app
            
            eval "$(ssh-agent -s)"
            ssh-add ~/.ssh/id_ed25519
            
            echo "--- Pulling latest code ---"
            git pull origin main
            
            # 3. Revert ownership to web user
            echo "--- Reverting ownership to www-data ---"
            sudo chown -R www-data:www-data /var/www/laravel-app
            
            # 4. Backend tasks
            echo "--- Running backend tasks ---"
            sudo -u www-data composer install --no-dev --optimize-autoloader
            sudo -u www-data php artisan migrate --force
            
            # 5. Build frontend
            echo "--- Building frontend assets ---"
            sudo -u www-data npm install
            sudo -u www-data npm run build
            
            # 6. Final cleanup
            echo "--- Caching config ---"
            sudo -u www-data php artisan config:cache
            
            echo "--- Restarting services ---"
            sudo systemctl reload nginx
            sudo systemctl restart supervisor
            echo "Deployment finished successfully!"